name: Capture screenshots of the live site
on:
  push:
    paths: ["tools/shots-request.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Capture
        run: python tools/shots.py "$(cat tools/shots-request.txt | head -1)" screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Update screenshots of the live site" || echo "no changes"
          git pull --rebase origin main
          git push
